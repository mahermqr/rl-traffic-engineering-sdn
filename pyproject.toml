[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-sdn-traffic-engineering"
version = "1.0.0"
description = "Dueling Double-DQN traffic engineering for an OpenFlow SDN"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.0,<3",
  "numpy>=1.22,<3",
  "networkx>=2.8,<4",
  "matplotlib>=3.5,<4",
  "pandas>=1.4,<3",
  "scipy>=1.8,<2",
  "attrs>=23.2",
  "packaging>=24",
]

[project.optional-dependencies]
controller = [
  "ryu==4.34; python_version < '3.12'",
  "eventlet==0.31.1; python_version < '3.12'",
]

[tool.setuptools]
packages = ["agent", "controller", "topology"]
py-modules = ["config"]
